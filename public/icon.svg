<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Inner Subtle Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25" />
  
  <!-- Stylized Mehregan Hex / Gem Symbol -->
  <g transform="translate(256, 256) scale(1.15)" filter="url(#glow)">
    <!-- Main Center Hexagon / Diamond Structure -->
    <path d="M0 -110 L95 -55 L95 55 L0 110 L-95 55 L-95 -55 Z" fill="none" stroke="url(#symbolGrad)" stroke-width="20" stroke-linejoin="round" />
    <path d="M0 -75 L65 -37 L65 37 L0 75 L-65 37 L-65 -37 Z" fill="url(#symbolGrad)" opacity="0.15" />
    
    <!-- Central Rays / Crown Structure -->
    <circle cx="0" cy="0" r="28" fill="url(#symbolGrad)" />
    <path d="M-55 -30 L0 -90 L55 -30" fill="none" stroke="url(#symbolGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-60 40 L0 80 L60 40" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
